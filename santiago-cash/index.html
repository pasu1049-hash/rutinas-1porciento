.hero-fade{position:absolute;inset:0;background:linear-gradient(90deg,#111 36%,rgba(17,17,17,.7) 58%,rgba(17,17,17,.1) 100%),linear-gradient(0deg,#111 0%,rgba(17,17,17,0) 45%)}
.hero .wrap{position:relative;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:20px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--T);font-weight:700;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.brand img{width:26px;height:26px;border-radius:50%}
.brand b{color:var(--n)}
.hello{margin-top:22px;font-size:13px;color:rgba(255,255,255,.7)}
.name{font-family:var(--T);font-weight:900;font-size:40px;line-height:.95;letter-spacing:-1px;text-transform:uppercase;margin-top:4px}
.name span{color:var(--n)}
.plan{margin-top:8px;font-size:13px;color:rgba(255,255,255,.75);max-width:60%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
.stat b{display:block;font-family:var(--T);font-weight:800;font-size:22px;line-height:1.1}
.stat b em{font-style:normal;color:var(--n)}
.stat span{font-size:9.5px;letter-spacing:.6px;white-space:nowrap;text-transform:uppercase;color:rgba(255,255,255,.65)}

/* WEEK BAR + TABS */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.weeks{position:relative;display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:64px;height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:var(--T);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.wk.on{background:var(--k);border-color:var(--k);color:#fff}
.wk .dots{display:flex;gap:2px}
.wk .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.wk.on .dots i{background:rgba(255,255,255,.25)}
.wk .dots i.si{background:var(--n)}
.wk .dots i.no{background:var(--bad)}
.wk.add{min-width:38px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-bottom:10px}
.tab{height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab b{font-family:var(--T);font-weight:800;font-size:13px}
.tab span{font-size:10px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.tab.on{border-color:var(--n);background:var(--nc)}
.tab.on b{color:var(--n)}
.tab .st{position:absolute}
.tab{position:relative}
.tab .badge{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%}
.tab .badge.si{background:var(--ok)} .tab .badge.no{background:var(--bad)}

/* GENERIC */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);margin-top:14px;overflow:hidden}
.pad{padding:16px}
.lbl{font-family:var(--T);font-weight:700;font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--n)}
h2{font-family:var(--T);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.3px;margin-top:4px}
h2 span{color:var(--n)}
.muted{color:var(--mute);font-size:13.5px}
.btn{height:46px;border-radius:12px;padding:0 16px;font-family:var(--T);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--n);color:#fff}
.btn.dark{background:var(--k);color:#fff}
.btn.ghost{border:1.5px solid var(--line);background:var(--card)}
.btn.wa{background:#25D366;color:#fff}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}

/* NEXT */
.next{background:var(--k);color:#fff;border:0;display:flex;align-items:center;gap:14px;padding:16px}
.next .ic{width:48px;height:48px;border-radius:12px;background:var(--n);display:flex;align-items:center;justify-content:center;font-family:var(--T);font-weight:900;font-size:20px;flex-shrink:0}
.next .tx{flex:1;min-width:0}
.next .tx small{font-family:var(--T);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--n)}
.next .tx b{display:block;font-family:var(--T);font-size:17px;font-weight:800;line-height:1.2}
.next .tx span{font-size:12px;color:rgba(255,255,255,.65)}
.next .go{font-size:22px;color:var(--n)}

/* DAY HEAD + ATTENDANCE */
.dayhead{padding:18px 16px 4px}
.att{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.att button{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-family:var(--T);font-weight:700;font-size:14px}
.att .si.on{background:var(--ok);border-color:var(--ok);color:#fff}
.att .no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.attmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);font-weight:600}
.field input,.field select{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);padding:0 12px;font-size:15px;width:100%}
.energy{display:flex;gap:4px}
.energy button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);font-size:18px}
.energy button.on{border-color:var(--n);background:var(--nc)}

/* BLOCKS */
.bh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--k);color:#fff}
.bh .L{width:32px;height:32px;border-radius:8px;background:var(--n);display:flex;align-items:center;justify-content:center;font-family:var(--T);font-weight:900;font-size:16px;flex-shrink:0}
.bh .T{flex:1;min-width:0}
.bh .T b{display:block;font-family:var(--T);font-weight:800;font-size:15px;line-height:1.15;text-transform:uppercase}
.bh .T span{font-size:11.5px;color:rgba(255,255,255,.65)}
.bh .tm{height:34px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-family:var(--T);font-weight:700;font-size:12px;color:#fff;white-space:nowrap}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--n);transition:width .3s}

.mob{padding:6px 14px 14px}
.mob h5{font-family:var(--T);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--n);margin:12px 0 4px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chk:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--n);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900;transition:.15s}
.chk.on .box{background:var(--n)}
.chk.on .box::after{content:'✓'}
.chk .t b{font-weight:600;font-size:14.5px}
.chk .t span{display:block;font-size:12.5px;color:var(--mute)}
.chk.on .t b{text-decoration:line-through;text-decoration-color:var(--n);color:var(--mute)}

.ex{padding:14px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exh{display:flex;gap:10px;align-items:flex-start}
.exh .code{font-family:var(--T);font-weight:800;color:var(--n);font-size:13px;width:24px;flex-shrink:0;padding-top:1px}
.exh .nm{flex:1;min-width:0}
.exh .nm b{font-family:var(--T);font-weight:700;font-size:15.5px;line-height:1.25;display:block}
.exh .nm span{display:block;font-size:12.5px;color:var(--mute);margin-top:3px}
.dose{font-family:var(--T);font-weight:800;font-size:12px;background:var(--nc);color:var(--n);padding:5px 9px;border-radius:8px;white-space:nowrap}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;align-items:center;gap:6px}
.set.c3{grid-template-columns:30px 1fr 1fr 46px}
.set.c2{grid-template-columns:30px 1fr 46px}
.set .sn{font-family:var(--T);font-weight:800;font-size:12px;color:var(--mute);text-align:center}
.set.hd{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);font-weight:600}
.set.hd div{text-align:center}
.inp{position:relative}
.inp input{width:100%;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);text-align:center;font-family:var(--T);font-weight:700;font-size:17px;padding:0 26px 0 8px;-moz-appearance:textfield}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp input:focus{outline:none;border-color:var(--n);background:var(--card)}
.inp input::placeholder{color:#B4B4B4;font-weight:600}
.inp em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10.5px;color:var(--mute);font-weight:600;pointer-events:none}
.done{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;color:var(--line);font-weight:900}
.done.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.ok .inp input{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.prev{margin-top:8px;font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.prev b{color:var(--ink);font-weight:700}
.prev .up{color:var(--ok);font-weight:700}

textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);padding:12px;font-size:15px;resize:vertical}
textarea:focus{outline:none;border-color:var(--n)}

/* PROGRESS */
.grid-att{width:100%;border-collapse:separate;border-spacing:4px;margin-top:8px}
.grid-att th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:center}
.grid-att th:first-child{text-align:left}
.grid-att td{height:40px;border-radius:9px;text-align:center;font-weight:800;background:var(--soft);font-family:var(--T);font-size:15px}
.grid-att td:first-child{background:none;text-align:left;font-size:13px;color:var(--mute)}
.grid-att td.si{background:var(--okc);color:var(--ok)}
.grid-att td.no{background:var(--badc);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--soft);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--T);font-size:22px;font-weight:800;line-height:1.1}
.kpi span{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.pr{display:grid;grid-template-columns:1fr 92px 64px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .a b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.pr .a span{font-size:11.5px;color:var(--mute)}
.pr .c{text-align:right;font-family:var(--T);font-weight:800;font-size:15px}
.pr .c small{display:block;font-size:11px;font-weight:700}
.pr .c small.up{color:var(--ok)} .pr .c small.eq{color:var(--mute)} .pr .c small.dn{color:var(--bad)}
.dayl{font-family:var(--T);font-weight:800;font-size:13px;margin:16px 0 2px;display:flex;gap:8px;align-items:center}
.dayl i{font-style:normal;background:var(--n);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:6px;letter-spacing:1px}
.vol{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:14px}
.vol .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vol .b i{display:block;width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--n);min-height:3px}
.vol .b.cur i{background:var(--k)}
@media (prefers-color-scheme:dark){.vol .b.cur i{background:#fff}}
.vol .b span{font-size:11px;color:var(--mute);font-weight:600}
.vol .b em{font-style:normal;font-size:11px;font-weight:700;font-family:var(--T)}

.rules{display:grid;gap:8px;margin-top:10px}
.rule{background:var(--soft);border-left:4px solid var(--n);border-radius:10px;padding:12px 14px}
.rule b{font-family:var(--T);font-weight:800;font-size:14px;display:block}
.rule span{font-size:13px;color:var(--mute)}

/* TIMER */
.timer{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(608px,calc(100% - 24px));
  background:var(--k);color:#fff;border-radius:18px;padding:14px 16px;z-index:50;display:flex;align-items:center;gap:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.timer.show{transform:translate(-50%,0)}
.timer svg{width:58px;height:58px;flex-shrink:0;transform:rotate(-90deg)}
.timer .tt{flex:1;min-width:0}
.timer .tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--T);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--n)}
.timer .tt b{display:block;font-family:var(--T);font-weight:900;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.timer .tb{display:flex;gap:6px}
.timer .tb button{height:42px;min-width:46px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.1);font-family:var(--T);font-weight:700;font-size:13px}
.timer .tb button.x{background:var(--n)}
.timer.end{animation:pulse .6s ease 3}
@keyframes pulse{50%{background:var(--n)}}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--k);color:#fff;
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:transform .3s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
.warn{background:var(--nc);color:var(--ink);border:1px solid var(--n);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
.foot{text-align:center;padding:26px 0 8px;color:var(--mute);font-size:12px}
.foot b{font-family:var(--T);color:var(--n);letter-spacing:2px;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
.pdfbtn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:38px;padding:0 14px;border-radius:10px;background:var(--n);color:#fff;font-family:var(--T);font-weight:700;font-size:13px;text-decoration:none}
.coachbtn{width:100%;margin-top:14px;min-height:96px;border-radius:16px;background:var(--n);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:16px 14px;box-shadow:0 10px 26px rgba(255,104,74,.35);text-align:center}
.coachbtn:active{transform:scale(.98)}
.coachbtn .cb1{display:flex;align-items:center;gap:8px;font-family:var(--T);font-weight:800;font-size:19px;line-height:1.15}
.coachbtn .cb2{font-size:13px;font-weight:600;color:rgba(255,255,255,.92)}
.coachbtn .cb3{font-family:var(--T);font-weight:800;font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:#111;background:#fff;border-radius:6px;padding:2px 8px;margin-top:4px}
.hide{display:none!important}
@media (min-width:700px){.name{font-size:52px}.plan{max-width:55%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ───────── storage ───────── */
let storageOK = true;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){ storageOK = false; }
  return null;
}
function clean(x){
  if(!x || typeof x!=='object' || !x.log) return null;
  Object.values(x.log).forEach(wk=>{ if(!wk) return; Object.values(wk).forEach(L=>{ if(!L) return;
    L.sets = L.sets || {}; L.mob = L.mob || {};
    Object.keys(L.sets).forEach(k=>{ const a=Array.isArray(L.sets[k])?L.sets[k]:[]; L.sets[k]=Array.from(a,v=>v&&typeof v==='object'?v:{}); }); }); });
  return x;
}
let S = clean(load()) || { v:1, weeks: CFG.semanas || 4, cur: 1, tab: DAYS[0].id, log: {} };
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK = false; } }

function dl(w, d){ // day log
  const wk = S.log['w'+w] ||= {};
  return wk[d] ||= { att:null, date:'', energy:0, notes:'', mob:{}, sets:{} };
}
function peek(w, d){ return (S.log['w'+w]||{})[d]; }

/* ───────── helpers ───────── */
const UNIT = { peso:'kg', reps:'reps', tiempo:'seg' };
function targets(ex, n){
  const d = ex.dosis;
  let m = d.match(/^(\d+)\s*·\s*(\d+)\s*·\s*(\d+)/);
  if(m) return [m[1],m[2],m[3]].concat(Array(Math.max(0,n-3)).fill(m[3])).slice(0,n);
  m = d.match(/(\d+)\s*\+\s*(\d+)/); if(m) return Array(n).fill(m[1]+'+'+m[2]);
  m = d.match(/(\d+)\s*min/); if(m) return Array(n).fill(String(+m[1]*60));
  m = d.match(/(\d+)/); return Array(n).fill(m ? m[1] : '');
}
function todayStr(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m; }
function num(v){ const x = parseFloat(String(v).replace(',','.')); return isNaN(x) ? null : x; }
function exKey(b, i){ return b.letra + (i+1); }
function setsOf(w, d, key){ const l = peek(w,d); return Array.from(l && l.sets && l.sets[key] || [], v=>v||{}); }
function bestKg(w, d, key){ let best=null; setsOf(w,d,key).forEach(s=>{ const k=num(s.kg); if(k!==null && (best===null||k>best)) best=k; }); return best; }
function dayVolume(w, d){
  let v=0; const day = DAYS.find(x=>x.id===d);
  day.bloques.forEach(b=>b.ejercicios.forEach((ex,i)=>{ if(ex.tipo!=='peso') return;
    setsOf(w,d,exKey(b,i)).forEach((s,si)=>{ const k=num(s.kg), r=num(s.r) ?? num(targets(ex,b.vueltas)[si]); if(k!==null && r!==null) v+=k*r; }); }));
  return v;
}
function weekAtt(w){ return DAYS.reduce((a,d)=>a+((peek(w,d.id)||{}).att==='si'?1:0),0); }
function totals(){
  let done=0, streak=0, run=0;
  for(let w=1; w<=S.weeks; w++) DAYS.forEach(d=>{ const a=(peek(w,d.id)||{}).att;
    if(a==='si'){ done++; run++; streak=Math.max(streak,run); } else if(a==='no'){ run=0; } });
  // racha actual = sesiones seguidas desde la última falta
  let cur=0; outer: for(let w=S.weeks; w>=1; w--) for(let i=DAYS.length-1;i>=0;i--){ const a=(peek(w,DAYS[i].id)||{}).att;
    if(a==='si') cur++; else if(a==='no') break outer; }
  return { done, cur };
}
function nextDay(){
  for(let w=1; w<=S.weeks; w++) for(const d of DAYS){ const a=(peek(w,d.id)||{}).att; if(!a) return { w, d }; }
  return null;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }

/* ───────── render: header ───────── */

function renderBar(){

/* ───────── render: día ───────── */
function renderDay(d){
  const w = S.cur, L = dl(w, d.id), prevL = peek(w-1, d.id);

    + '<div class="pad" style="padding-top:6px"><div class="att"><button class="si'+(L.att==='si'?' on':'')+'" data-att="si">✓ Asistí</button><button class="no'+(L.att==='no'?' on':'')+'" data-att="no">✕ No fui</button></div>'

          + '<div class="inp"><input inputmode="'+(ex.dosis.includes('+')?'text':'numeric')+'" data-k="'+key+'" data-s="'+s+'" data-f="r" value="'+esc(v.r||'')+'" placeholder="'+esc(tg[s])+'"/><em>'+(isP?'':u)+'</em></div>'
          + '<button class="done'+(v.ok?' on':'')+'" data-done="'+key+'|'+s+'" aria-label="Serie '+(s+1)+' hecha">✓</button></div>';
      }
      // historial

      if(isP){
        const pb = bestKg(w-1, d.id, key); let best=null, bestW=0;
        for(let x=1; x<w; x++){ const v=bestKg(x,d.id,key); if(v!==null && (best===null||v>best)){best=v;bestW=x;} }
        const nowB = bestKg(w, d.id, key);
        if(pb!==null) hist += '<span>Semana pasada: <b>'+pb+' kg</b></span>';
        if(best!==null) hist += '<span>Récord: <b>'+best+' kg</b> (S'+bestW+')</span>';
        if(nowB!==null && best!==null && nowB>best) hist += '<span class="up">▲ Nuevo récord +'+(Math.round((nowB-best)*10)/10)+' kg</span>';

        + '<div class="sets">'+rows+'</div>'+(hist?'<div class="prev">'+hist+'</div>':'')+'</div>';
    });
    h += '<section class="card"><div class="bh"><span class="L">'+b.letra+'</span><span class="T"><b>'+esc(b.titulo)+'</b><span>'+n+' vueltas · descanso '+esc(b.descanso)+' · '+doneSets+'/'+allSets+' series</span></span>'
      + '<button class="tm" data-timer="'+(b.descanso_seg||90)+'">⏱ '+fmtT(b.descanso_seg||90)+'</button></div>'
      + '<div class="prog"><i style="width:'+(allSets?doneSets/allSets*100:0)+'%"></i></div>'+exs+'</section>';
  });

  h += '<section class="card pad"><div class="lbl">Notas del día</div><p class="muted" style="margin:4px 0 10px">Sensaciones, molestias, récords. Le llega a Pasu en el resumen.</p><textarea id="fNotes" placeholder="Ej: la sentadilla salió liviana, la semana que viene subo 5 kg">'+esc(L.notes)+'</textarea>'
    + '<button class="coachbtn" id="finish"><span class="cb1">'+WA_ICON+'Guardar y enviar al coach</span><span class="cb2">Matías Pasutti · Instructor y coach en calistenia</span><span class="cb3">1% Fitness</span></button>'
    + '<p class="muted" style="text-align:center;font-size:12px;margin-top:8px">Se abre WhatsApp con el resumen de tu '+esc(d.label.toLowerCase())+' listo: solo tocá enviar.</p></section>';
  return h;
}

/* ───────── render: progreso ───────── */
function renderProg(){
  const t = totals(); let h='';
  // asistencia
  let rows='';
  for(let w=1; w<=S.weeks; w++){ rows += '<tr><td>Sem '+w+'</td>'+DAYS.map(d=>{ const l=peek(w,d.id)||{}; const a=l.att;
    return '<td class="'+(a||'')+'">'+(a==='si'?(l.date?'<span style="font-size:11px">'+fmtDate(l.date)+'</span>':'✓'):a==='no'?'✕':'·')+'</td>'; }).join('')+'</tr>'; }
  const marked = (()=>{ let m=0; for(let w=1;w<=S.weeks;w++) DAYS.forEach(d=>{ if((peek(w,d.id)||{}).att) m++; }); return m; })();
  h += '<section class="card pad"><div class="lbl">Asistencia</div><h2>Constancia <span>es todo</span></h2>'
    + '<div class="kpis"><div class="kpi"><b>'+t.done+'</b><span>Sesiones</span></div><div class="kpi"><b>'+(marked?Math.round(t.done/marked*100):0)+'%</b><span>Asistencia</span></div><div class="kpi"><b>'+t.cur+'</b><span>Racha</span></div></div>'
    + '<table class="grid-att"><thead><tr><th></th>'+DAYS.map(d=>'<th>'+esc(d.label)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></section>';
  // volumen
  const vols=[]; for(let w=1; w<=S.weeks; w++) vols.push(DAYS.reduce((a,d)=>a+dayVolume(w,d.id),0));
  const mx = Math.max(1,...vols);
  h += '<section class="card pad"><div class="lbl">Volumen total</div><p class="muted">Kilos movidos por semana (peso × reps)</p><div class="vol">'
    + vols.map((v,i)=>'<div class="b'+(i+1===S.cur?' cur':'')+'"><em>'+(v?(v>=1000?(v/1000).toFixed(1)+'t':Math.round(v)):'')+'</em><i style="height:'+(v/mx*80)+'%"></i><span>S'+(i+1)+'</span></div>').join('')+'</div></section>';
  // por ejercicio
  let ex='';
  DAYS.forEach(d=>{ let rs='';
    d.bloques.forEach(b=>b.ejercicios.forEach((e,i)=>{ if(e.tipo!=='peso') return; const key=exKey(b,i);
      const series=[]; for(let w=1; w<=S.weeks; w++) series.push(bestKg(w,d.id,key));
      const vals = series.filter(v=>v!==null); const first=vals[0], last=vals[vals.length-1];
      const diff = vals.length>1 ? Math.round((last-first)*10)/10 : null;
      rs += '<div class="pr"><div class="a"><b>'+esc(e.nombre)+'</b><span>'+key+' · '+esc(e.dosis)+'</span></div>'+spark(series)
        + '<div class="c">'+(last!=null?last+' kg':'—')+(diff!==null?'<small class="'+(diff>0?'up':diff<0?'dn':'eq')+'">'+(diff>0?'▲ +':diff<0?'▼ ':'= ')+diff+' kg</small>':'')+'</div></div>';
    }));
    if(rs) ex += '<div class="dayl"><i>'+esc(d.label)+'</i>'+esc(d.titulo)+'</div><div>'+rs+'</div>';
  });
  h += '<section class="card pad"><div class="lbl">Cargas</div><h2>Tu <span>progresión</span></h2><p class="muted" style="margin-top:4px">Mejor peso de cada semana. La meta: que la línea suba.</p>'+ex+'</section>';
  // reglas
  if(CFG.reglas) h += '<section class="card pad"><div class="lbl">Las reglas del 1%</div><div class="rules">'+CFG.reglas.map(r=>'<div class="rule"><b>'+esc(r.t)+'</b><span>'+esc(r.d)+'</span></div>').join('')+'</div></section>';
  // acciones
  h += '<section class="card pad"><div class="lbl">Reporte al coach</div><h2>Mandale tu semana <span>a Pasu</span></h2><p class="muted" style="margin:6px 0 12px">Se arma un resumen de la semana '+S.cur+' con tus pesos, asistencia y notas.</p>'
    + '<button class="btn wa full" id="sendWA">Enviar resumen por WhatsApp</button>'
    + '<div class="row" style="margin-top:8px"><button class="btn ghost" style="flex:1" id="exp">⬇ Backup</button><button class="btn ghost" style="flex:1" id="imp">⬆ Restaurar</button></div>'
    + '<input type="file" id="impFile" accept="application/json,.json" class="hide"/>'
    + '<button class="btn full" style="margin-top:8px;color:var(--bad);font-size:13px" id="reset">Borrar todos los datos</button></section>';
  return h;
}
function spark(arr){
  const W=92,H=30,p=3; const vals=arr.map((v,i)=>[i,v]).filter(x=>x[1]!==null);
  if(vals.length<1) return '<svg width="'+W+'" height="'+H+'"></svg>';
  const ys=vals.map(v=>v[1]); const mn=Math.min(...ys), mx=Math.max(...ys); const n=Math.max(1,arr.length-1);
  const X=i=>p+i/n*(W-2*p), Y=v=>mx===mn?H/2:H-p-(v-mn)/(mx-mn)*(H-2*p);
  const pts=vals.map(v=>X(v[0]).toFixed(1)+','+Y(v[1]).toFixed(1)).join(' ');
  const lastP=vals[vals.length-1];
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><polyline points="'+pts+'" fill="none" stroke="#FF684A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + vals.map(v=>'<circle cx="'+X(v[0])+'" cy="'+Y(v[1])+'" r="'+(v===lastP?3.4:2)+'" fill="#FF684A"/>').join('')+'</svg>';
}

/* ───────── main render ───────── */
function render(){
  renderHero(); renderBar();
  const d = DAYS.find(x=>x.id===S.tab);
  let body;
  try{ body = d ? renderDay(d) : renderProg(); }
  catch(err){ body = '<section class="card pad"><div class="lbl">Ups</div><h2>Algo no cargó bien</h2><p class="muted" style="margin-top:6px">Tus datos están guardados. Mandale una captura de esta pantalla a Pasu.</p><p class="muted" style="font-size:11px;margin-top:8px">'+esc(err && err.message)+'</p></section>'; }
  $('#main').innerHTML = (storageOK?'':'<div class="warn" style="display:block">⚠️ Este navegador no deja guardar datos. Abrí el archivo con Chrome o Safari, o usá Backup al terminar.</div>') + body;
}

/* ───────── eventos ───────── */
document.addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.w){ S.cur=+b.dataset.w; save(); render(); return; }
  if(b.id==='addWeek'){ S.weeks++; S.cur=S.weeks; save(); render(); toast('Semana '+S.weeks+' agregada'); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; save(); render(); window.scrollTo({top:$('.bar').offsetTop,behavior:'smooth'}); return; }
  if(b.dataset.jump){ const [w,d]=b.dataset.jump.split('|'); S.cur=+w; S.tab=d; save(); render(); window.scrollTo({top:$('.bar').offsetTop,behavior:'smooth'}); return; }
  const d = DAYS.find(x=>x.id===S.tab);
  if(b.dataset.att && d){ const L=dl(S.cur,d.id); L.att = L.att===b.dataset.att ? null : b.dataset.att; if(L.att==='si' && !L.date) L.date=todayStr(); save(); render(); return; }
  if(b.dataset.en && d){ const L=dl(S.cur,d.id); L.energy = L.energy===+b.dataset.en ? 0 : +b.dataset.en; save(); render(); return; }
  if(b.dataset.mob && d){ const L=dl(S.cur,d.id); L.mob[b.dataset.mob]=!L.mob[b.dataset.mob]; save(); keepScroll(render); return; }
  if(b.dataset.moball && d){ const L=dl(S.cur,d.id); const all=[]; CFG.movilidad.grupos.forEach((g,gi)=>g.items.forEach((_,ii)=>all.push(gi+'_'+ii)));
    const on = !all.every(k=>L.mob[k]); all.forEach(k=>L.mob[k]=on); save(); keepScroll(render); return; }
  if(b.dataset.timer){ startTimer(+b.dataset.timer, 'Descanso'); return; }
  if(b.dataset.done && d){
    const [key,s]=b.dataset.done.split('|'); const L=dl(S.cur,d.id); const arr=L.sets[key] ||= []; for(let i=0;i<=+s;i++) arr[i] ||= {}; const v=arr[+s];
    v.ok=!v.ok;
    if(v.ok){
      const blk=d.bloques.find(x=>key.startsWith(x.letra)); const ex=blk.ejercicios[+key.slice(1)-1];
      if(!v.r) v.r = targets(ex, blk.vueltas)[+s];
      if(ex.tipo==='peso' && !v.kg){ const inp=document.querySelector('input[data-k="'+key+'"][data-s="'+s+'"][data-f="kg"]'); if(inp && inp.placeholder && inp.placeholder!=='—') v.kg=inp.placeholder; }
      if(blk.ejercicios.length-1 === +key.slice(1)-1 && +s < blk.vueltas-1) startTimer(blk.descanso_seg||90, 'Vuelta '+(+s+1)+' ✓ · descanso');
    }
    save(); keepScroll(render); return;
  }
  if(b.id==='finish' && d){ const L=dl(S.cur,d.id); L.att='si'; if(!L.date) L.date=todayStr(); save();
    const url='https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(daySummary(S.cur,d));
    const win=window.open(url,'_blank'); if(!win) location.href=url;
    const nd=nextDay(); render(); toast('¡'+d.label+' guardado! '+(nd?'Próximo: '+nd.d.label+' (S'+nd.w+')':'Plan completo 🏆')); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(b.id==='sendWA'){ window.open('https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(summary(S.cur)),'_blank'); return; }
  if(b.id==='exp'){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='backup_'+CFG.output_slug+'_'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup descargado'); return; }
  if(b.id==='imp'){ $('#impFile').click(); return; }
  if(b.id==='reset'){ if(confirm('¿Seguro? Se borran todos tus pesos y asistencias de este teléfono.')){ S={ v:1, weeks:CFG.semanas||4, cur:1, tab:DAYS[0].id, log:{} }; save(); render(); toast('Datos borrados'); } return; }
});
document.addEventListener('input', ev=>{
  const t=ev.target, d=DAYS.find(x=>x.id===S.tab); if(!d) return;
  const L=dl(S.cur,d.id);
  if(t.dataset.k){ const arr=L.sets[t.dataset.k] ||= []; for(let i=0;i<=+t.dataset.s;i++) arr[i] ||= {}; const v=arr[+t.dataset.s]; v[t.dataset.f]=t.value.trim(); save(); return; }
  if(t.id==='fNotes'){ L.notes=t.value; save(); return; }
  if(t.id==='fDate'){ L.date=t.value; save(); return; }
});
document.addEventListener('change', ev=>{
  if(ev.target.id==='impFile'){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const x=clean(JSON.parse(r.result)); if(!x) throw 0; S=x; save(); render(); toast('Datos restaurados ✓'); }catch(e){ toast('Ese archivo no es un backup válido'); } }; r.readAsText(f); }
});
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }

/* ───────── resumen WhatsApp ───────── */
function dayLines(w, d){
  const L=peek(w,d.id)||{}; let t='';
  t += '*'+d.label+' · '+d.titulo+'* '+(L.att==='si'?'✅'+(L.date?' '+fmtDate(L.date):''):L.att==='no'?'❌ no fui':'⏳ pendiente')+(L.energy?' '+['😴','😐','💪','🔥'][L.energy-1]:'')+'\n';
  if(!L.sets) return t;
  const mobTot=CFG.movilidad.grupos.reduce((a,g)=>a+g.items.length,0), mobOk=Object.values(L.mob||{}).filter(Boolean).length;
  if(mobOk) t += 'Movilidad: '+mobOk+'/'+mobTot+'\n';
  d.bloques.forEach(b=>b.ejercicios.forEach((ex,i)=>{ const key=exKey(b,i), tg=targets(ex,b.vueltas);
    const arr=setsOf(w,d.id,key).slice(0,b.vueltas).map((s,si)=>(s.kg||s.r||s.ok)?{kg:s.kg,r:s.r||tg[si]}:null).filter(Boolean);
    if(!arr.length) return;
    const body = ex.tipo==='peso' ? arr.map(s=>(s.kg||'–')+'×'+s.r).join(' · ') : arr.map(s=>s.r).join(' · ')+(ex.tipo==='tiempo'?' seg':'');
    t += key+' '+ex.nombre+': '+body+'\n'; }));
  if(L.notes) t += '📝 '+L.notes.trim()+'\n';
  return t;
}
function daySummary(w, d){
  const v=dayVolume(w,d.id), tt=totals();
  return '💪 *Rutina 1% · '+CFG.client_name+'*\n*Semana '+w+'*\n\n'+dayLines(w,d)
    + (v?'\nVolumen del día: '+Math.round(v)+' kg':'')
    + '\nAsistencia semana: '+weekAtt(w)+'/'+DAYS.length+' · Sesiones: '+tt.done+'/'+(S.weeks*DAYS.length)+'\n\n#UNOPORCIENTO';
}
function summary(w){
  let t = '💪 *Rutina 1% · '+CFG.client_name+'*\n*Semana '+w+'* — asistencia '+weekAtt(w)+'/'+DAYS.length+'\n';
  DAYS.forEach(d=>{ t += '\n'+dayLines(w,d); });
  const v = DAYS.reduce((a,d)=>a+dayVolume(w,d.id),0); if(v) t += '\nVolumen semana: '+Math.round(v)+' kg\n';
  return t + '\n#UNOPORCIENTO';
}

/* ───────── timer ───────── */
let T={end:0,total:0,iv:null}, actx=null;
function fmtT(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function startTimer(sec,label){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  T.total=sec; T.end=Date.now()+sec*1000; $('#tLabel').textContent=label; $('#timer').classList.remove('end'); $('#timer').classList.add('show');
  clearInterval(T.iv); tick(); T.iv=setInterval(tick,250);
}
function tick(){
  const left=(T.end-Date.now())/1000; $('#tTime').textContent=fmtT(left);
  $('#ring').setAttribute('stroke-dashoffset', (163.4*(1-Math.max(0,left)/T.total)).toFixed(1));
  if(left<=0){ clearInterval(T.iv); $('#tTime').textContent='¡Dale!'; $('#timer').classList.add('end'); beep(); try{navigator.vibrate&&navigator.vibrate([300,120,300,120,500]);}catch(e){}
    setTimeout(()=>$('#timer').classList.remove('show'),6000); }
}
function beep(){ if(!actx) return; try{ [0,.25,.5].forEach((d,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i===2?1046:784; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime+d); g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.22); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.25); }); }catch(e){} }
$('#tPlus').onclick=()=>{ T.end+=15000; T.total+=15; if(!T.iv||$('#tTime').textContent==='¡Dale!'){ $('#timer').classList.remove('end'); clearInterval(T.iv); T.iv=setInterval(tick,250);} tick(); };
$('#tMinus').onclick=()=>{ T.end-=15000; tick(); };
$('#tStop').onclick=()=>{ clearInterval(T.iv); $('#timer').classList.remove('show'); };

$('#tabs').style.gridTemplateColumns='repeat('+(DAYS.length+1)+',1fr)';
if(CFG.pdf_url){ const a=$('#pdfBtn'); a.href=CFG.pdf_url; a.classList.remove('hide'); }
render();
</script>
